# CI für poker-tracker — Korrektheits-Gates bei jedem Push.
# Läuft Typecheck (main + renderer) und die schnellen Verifikations-Tests
# (ICM-Mathematik, Chip-Erhaltung, 0-Stack-ICM). Der langsame Nash-Solver-Lauf
# (~5 min, MC) ist bewusst NICHT in CI — lokal via scripts/verify-nash.mjs.

image: node:20

stages:
  - check

# node_modules zwischen Jobs/Pipelines cachen (Schlüssel = Lockfile-Hash).
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

.install: &install
  before_script:
    - npm ci --no-audit --no-fund

typecheck:
  stage: check
  <<: *install
  script:
    - npm run typecheck

verify:
  stage: check
  <<: *install
  script:
    - npm run verify
